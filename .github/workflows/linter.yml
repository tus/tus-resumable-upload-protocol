name: Run OpenAPI linter

on: [push, pull_request]

jobs:
  build:
    name: Run Spectral
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '^22.23.4'
          check-latest: true

      - name: Run Spectral
        run: npx --yes @stoplight/spectral-cli@6.16.0 lint --ruleset .spectral.yml 'OpenAPI/*.yaml'
